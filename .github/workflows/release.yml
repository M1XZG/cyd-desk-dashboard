name: Release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: "1788134400"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tools.txt

      - name: Check embedded examples
        run: python tools/check_examples.py

      - name: Check SBOM
        run: python tools/generate_sbom.py --check

      - name: Install pinned build tools
        run: python -m pip install --requirement requirements-tools.txt

      - name: Build CYD firmware
        run: pio run --project-dir firmware --environment cyd

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          mkdir release
          cp firmware/.pio/build/cyd/firmware.bin release/
          cp firmware/.pio/build/cyd/bootloader.bin release/
          cp firmware/.pio/build/cyd/partitions.bin release/
          platformio_core_dir="$(
            pio system info --json-output |
              python -c 'import json, sys; print(json.load(sys.stdin)["core_dir"]["value"])'
          )"
          cp \
            "$platformio_core_dir/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            release/
          cp SBOM.spdx.json release/
          (
            cd release
            sha256sum \
              firmware.bin \
              bootloader.bin \
              boot_app0.bin \
              partitions.bin \
              SBOM.spdx.json > SHA256SUMS
          )

      - name: Attest release artifacts
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/firmware.bin \
            release/bootloader.bin \
            release/boot_app0.bin \
            release/partitions.bin \
            release/SBOM.spdx.json \
            release/SHA256SUMS \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
