name: Build firmware

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  platformio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tools.txt
      - name: Check embedded examples
        working-directory: .
        run: python tools/check_examples.py
      - name: Check SBOM
        working-directory: .
        run: python tools/generate_sbom.py --check
      - name: Install PlatformIO
        working-directory: .
        run: python -m pip install --requirement requirements-tools.txt
      - name: Build CYD firmware
        run: pio run -e cyd
