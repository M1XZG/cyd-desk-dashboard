name: Feature request
description: Suggest a focused improvement for the dashboard.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What should the dashboard do?
      description: Explain the use case and expected behavior.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Hardware or service constraints
      description: Include board revision, provider, or memory considerations.
